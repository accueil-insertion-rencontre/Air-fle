version: '3.8'

services:
  # Reverse Proxy Dev (front + api)
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy-dev
    ports:
      - "8080:80"
    volumes:
      - ./air-fle-api/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-dev
      - air-fle-front-container
    networks:
      - airfle-dev-network
    restart: unless-stopped

  # Frontend Angular (hot reload)
  air-fle-front-container:
    build:
      context: ./air-fle-front
      dockerfile: Dockerfile
      target: dev
    container_name: air-fle-front-container
    ports:
      - "4200:4200"
    volumes:
      - ./air-fle-front/src:/app/src
      - ./air-fle-front/public:/app/public
      - ./air-fle-front/angular.json:/app/angular.json
      - ./air-fle-front/proxy.conf.json:/app/proxy.conf.json
      - ./air-fle-front/tsconfig.json:/app/tsconfig.json
      - ./air-fle-front/package.json:/app/package.json
      - ./air-fle-front/package-lock.json:/app/package-lock.json
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - airfle-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres-dev:
    image: postgres:15-alpine
    container_name: postgres-dev
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-airfle}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - airfle-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airfle}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis-dev:
    image: redis:alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - airfle-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api-dev:
    build:
      context: ./air-fle-api
      dockerfile: Dockerfile
      target: dev
    container_name: api-dev
    expose:
      - "3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres-dev:5432/airfle?schema=public}
      - REDIS_URL=redis://redis-dev:6379
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - PORT=${PORT:-3000}
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    volumes:
      - ./air-fle-api/src:/app/src
      - ./air-fle-api/test:/app/test
      - ./air-fle-api/prisma:/app/prisma
      - ./air-fle-api/package.json:/app/package.json
      - ./air-fle-api/tsconfig.json:/app/tsconfig.json
      - ./air-fle-api/nest-cli.json:/app/nest-cli.json
      - /app/node_modules
    networks:
      - airfle-dev-network
    command: sh -c "npx prisma migrate deploy && npm run seed && npm run start:docker"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  airfle-dev-network:
    name: airfle-dev-network

volumes:
  postgres-dev-data:
    name: postgres-dev-data
  redis-dev-data:
    name: redis-dev-data

