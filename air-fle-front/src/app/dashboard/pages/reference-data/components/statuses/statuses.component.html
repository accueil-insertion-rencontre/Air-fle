<div class="statuses-container">
  <!-- Actions -->
  <div class="statuses-actions">
    <button class="back-btn" (click)="goBack()">
      <span class="btn-icon">←</span>
      Retour
    </button>

  <h2 class="d-flex align-items-center gap-2">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Statuts
  </h2>

    <button class="create-btn" (click)="openCreateModal()">
      <span class="btn-icon">+</span>
      Ajouter un statut
    </button>
  </div>

  <!-- Message d'erreur -->
  <div *ngIf="error" class="error-message">
    <p>{{ error }}</p>
    <button (click)="error = null" class="close-error">×</button>
  </div>

  <!-- Contenu principal -->
  <div class="statuses-content">
    <div class="statuses-list">
      <!-- En-tête du tableau -->
      <div class="statuses-header">
        <div class="column name">LIBELLÉ</div>
        <div class="column actions">ACTIONS</div>
      </div>

      <!-- Loading -->
      <div *ngIf="isLoading" class="loading-indicator">
        <div class="spinner"></div>
        <span>Chargement des statuts...</span>
      </div>

      <!-- Liste des statuts -->
      <div *ngFor="let status of statuses; trackBy: trackByStatusId" class="status-item">
        <div class="column name">
          <div class="status-name">{{ status.label }}</div>
        </div>

        <div class="column actions">
          <button class="edit-btn" (click)="openEditModal(status)">Modifier</button>
          <button class="delete-btn" (click)="deleteStatus(status)">Supprimer</button>
        </div>
      </div>

      <!-- État vide -->
      <div *ngIf="!isLoading && statuses.length === 0" class="empty-state">
        <p>Aucun statut trouvé</p>
        <button class="create-btn" (click)="openCreateModal()">
          <span class="btn-icon">+</span>
          Ajouter un statut
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal de création -->
<div class="modal-overlay" *ngIf="isCreateModalOpen" (click)="closeCreateModal()" (keyup.escape)="closeCreateModal()" tabindex="0">
  <div class="modal-content" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()" tabindex="-1">
    <div class="modal-header">
      <h2>Ajouter un statut</h2>
      <button class="close-btn" (click)="closeCreateModal()">×</button>
    </div>

    <div class="modal-body">
      <form [formGroup]="createForm" (ngSubmit)="createStatus()">
        <div class="form-group">
          <label for="createLabel">Libellé *</label>
          <input
            id="createLabel"
            type="text"
            formControlName="label"
            placeholder="Ex: Actif, Inactif, En attente..."
            [class.error]="createLabel?.invalid && createLabel?.touched"
          />
          <div *ngIf="createLabel?.invalid && createLabel?.touched" class="error-text">
            <span *ngIf="createLabel?.hasError('required')">Le libellé est requis</span>
            <span *ngIf="createLabel?.hasError('minlength')"
              >Le libellé doit contenir au moins 2 caractères</span
            >
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="cancel-btn" (click)="closeCreateModal()">Annuler</button>
          <button type="submit" class="submit-btn" [disabled]="createForm.invalid">Créer</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal d'édition -->
<div class="modal-overlay" *ngIf="isEditModalOpen" (click)="closeEditModal()" (keyup.escape)="closeEditModal()" tabindex="0">
  <div class="modal-content" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()" tabindex="-1">
    <div class="modal-header">
      <h2>Modifier le statut</h2>
      <button class="close-btn" (click)="closeEditModal()">×</button>
    </div>

    <div class="modal-body">
      <form [formGroup]="editForm" (ngSubmit)="updateStatus()">
        <div class="form-group">
          <label for="editLabel">Libellé *</label>
          <input
            id="editLabel"
            type="text"
            formControlName="label"
            placeholder="Ex: Actif, Inactif, En attente..."
            [class.error]="editLabel?.invalid && editLabel?.touched"
          />
          <div *ngIf="editLabel?.invalid && editLabel?.touched" class="error-text">
            <span *ngIf="editLabel?.hasError('required')">Le libellé est requis</span>
            <span *ngIf="editLabel?.hasError('minlength')"
              >Le libellé doit contenir au moins 2 caractères</span
            >
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="cancel-btn" (click)="closeEditModal()">Annuler</button>
          <button type="submit" class="submit-btn" [disabled]="editForm.invalid">
            Sauvegarder
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
