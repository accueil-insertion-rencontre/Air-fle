version: '3.8'

services:
  postgres-prod:
    image: postgres:15-alpine
    container_name: air-fle-postgres-prod
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=airfle
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    networks:
      - air-fle-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airfle"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-prod:
    image: redis:7-alpine
    container_name: air-fle-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data-prod:/data
    networks:
      - air-fle-network-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-prod:
    build:
      context: ./air-fle-api
      dockerfile: Dockerfile.prod
    container_name: air-fle-api-prod
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./air-fle-api/.env.production
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-prod:5432/airfle?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis-prod:6379
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - JWT_EXPIRES_IN=24h
      - PORT=3000
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    networks:
      - air-fle-network-prod
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend-prod:
    build:
      context: ./air-fle-front
      dockerfile: Dockerfile.prod
    container_name: air-fle-front-prod
    ports:
      - "8080:80"
    depends_on:
      - api-prod
    networks:
      - air-fle-network-prod
    restart: unless-stopped

networks:
  air-fle-network-prod:
    name: air-fle-network-prod
    driver: bridge

volumes:
  postgres-data-prod:
    name: air-fle-postgres-data-prod
  redis-data-prod:
    name: air-fle-redis-data-prod

