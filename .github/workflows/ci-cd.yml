name: CI/CD Pipeline - Air-FLE

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ghcr.io/${{ github.repository }}/api
  IMAGE_NAME_FRONT: ghcr.io/${{ github.repository }}/frontend

jobs:
  # =============================================================================
  # DÉTECTION DES CHANGEMENTS
  # =============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      frontend: ${{ steps.changes.outputs.frontend }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'air-fle-api/**'
              - 'docker-compose*.yml'
            frontend:
              - 'air-fle-front/**'
              - 'nginx.conf'
            docker:
              - '**/Dockerfile*'
              - 'docker-compose*.yml'
              - '.dockerignore'

  # =============================================================================
  # TESTS ET BUILD API
  # =============================================================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    defaults:
      run:
        working-directory: ./air-fle-api

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: testuser
          POSTGRES_DB: airfle_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: air-fle-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/airfle_test

      - name: Seed test database
        run: npm run seed
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/airfle_test
          NODE_ENV: test

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/airfle_test

      - name: Build application
        run: npm run build

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./air-fle-api/coverage

  # =============================================================================
  # TESTS ET BUILD FRONTEND
  # =============================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./air-fle-front

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: air-fle-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test:headless

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: air-fle-front/dist/

  # =============================================================================
  # TESTS E2E (Cypress)
  # =============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [api-tests, frontend-tests]
    if: always() && (needs.api-tests.result == 'success' || needs.frontend-tests.result == 'success')
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: testuser
          POSTGRES_DB: airfle_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            air-fle-api/package-lock.json
            air-fle-front/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: ./air-fle-api

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: ./air-fle-front

      - name: Setup test database
        working-directory: ./air-fle-api
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run seed
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/airfle_e2e
          NODE_ENV: test

      - name: Start application
        run: |
          npm run start &
          sleep 30
        working-directory: ./air-fle-api
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/airfle_e2e
          PORT: 3000

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./air-fle-front
          start: npm run start
          wait-on: 'http://localhost:4200, http://localhost:3000/api/v1/health'
          wait-on-timeout: 120
          browser: chrome
          record: false

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: air-fle-front/cypress/screenshots

  # =============================================================================
  # BUILD ET PUSH DOCKER IMAGES
  # =============================================================================
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [api-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_API }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_FRONT }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./air-fle-api
          file: ./air-fle-api/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./air-fle-front
          file: ./air-fle-front/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # DÉPLOIEMENT EN PRODUCTION
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: http://46.62.162.199

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp docker-compose.prod.yml deploy/
          cp nginx.conf deploy/
          cp -r air-fle-api/scripts deploy/

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd /opt/air-fle
            
            # Backup current version
            docker-compose -f docker-compose.prod.yml down
            
            # Pull new images
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_NAME_API }}:latest
            docker pull ${{ env.IMAGE_NAME_FRONT }}:latest
            
            # Update environment
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}"
            export ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
            export TEACHER_EMAIL="${{ secrets.TEACHER_EMAIL }}"
            export TEACHER_PASSWORD="${{ secrets.TEACHER_PASSWORD }}"
            
            # Deploy new version
            docker-compose -f docker-compose.prod.yml up -d
            
            # Run database migrations and seeds
            docker-compose -f docker-compose.prod.yml exec -T api-prod npx prisma migrate deploy
            docker-compose -f docker-compose.prod.yml exec -T api-prod npm run seed
            
            # Health check
            sleep 30
            curl -f http://localhost/api/v1/health || exit 1
            
            echo "Deployment successful!"
          EOF

      - name: Cleanup old images
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            docker image prune -f
            docker system prune -f
          EOF

  # =============================================================================
  # NOTIFICATIONS
  # =============================================================================
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    
    steps:
      - name: Send success notification
        if: needs.deploy-production.result == 'success'
        run: |
          echo "Déploiement réussi sur http://46.62.162.199"
          
      - name: Send failure notification
        if: needs.deploy-production.result == 'failure'
        run: |
          echo "Échec du déploiement - Vérifiez les logs"